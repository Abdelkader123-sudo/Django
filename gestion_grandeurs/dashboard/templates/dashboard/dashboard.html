<h2>Dashboard</h2>
<p id="connection_status">Connexion au flux des mesures...</p>
<textarea id="dashboard_log" cols="80" rows="20" readonly></textarea>
<script>
const websocketProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
const dashboardSocket = new WebSocket(
    websocketProtocol + "//" + window.location.host + "/ws/sensor/temperature/"
);
const dashboardLog = document.querySelector("#dashboard_log");
const connectionStatus = document.querySelector("#connection_status");

dashboardSocket.onopen = function () {
    connectionStatus.textContent = "Connecté";
};
dashboardSocket.onmessage = function (event) {
    dashboardLog.value += event.data + "\n";
    dashboardLog.scrollTop = dashboardLog.scrollHeight;
};
dashboardSocket.onerror = function (event) {
    console.error("Erreur de connexion au flux des mesures", event);
};
dashboardSocket.onclose = function () {
    connectionStatus.textContent = "Connexion fermée";
};
</script>
