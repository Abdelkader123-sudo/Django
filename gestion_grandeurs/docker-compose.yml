services:
  redis:
    image: redis:7
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto_config:/mosquitto/config
    restart: unless-stopped

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 gestion_grandeurs.asgi:application
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - sqlite_data:/app/data
      - ./secrets:/app/secrets:ro
    depends_on:
      - redis
      - mosquitto
    restart: unless-stopped

  mqtt:
    build: .
    command: mqttasgi -H mosquitto -p 1883 gestion_grandeurs.asgi:application
    env_file: .env
    volumes:
      - sqlite_data:/app/data
      - ./secrets:/app/secrets:ro
    depends_on:
      - redis
      - mosquitto
    restart: unless-stopped

volumes:
  sqlite_data: